update_permissions:
    - comment: 'authzgen: final _and term in filter/check is generated; edit the preceding row restrictions.'
      permission:
        check:
            _and:
                - _exists:
                    _table:
                        name: operator
                        schema: public
                    _where:
                        id:
                            _in: x-hasura-mythic-write-actor-ids
        columns:
            - deleted
        filter:
            _and:
                - _exists:
                    _table:
                        name: operator
                        schema: public
                    _where:
                        id:
                            _in: x-hasura-mythic-write-actor-ids
      role: mythic_admin
