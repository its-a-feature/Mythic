array_relationships:
    - name: apitokens
      using:
        foreign_key_constraint_on:
            column: chat_channel_id
            table:
                name: apitokens
                schema: public
    - name: messages
      using:
        foreign_key_constraint_on:
            column: channel_id
            table:
                name: chat_message
                schema: public
    - name: read_states
      using:
        foreign_key_constraint_on:
            column: channel_id
            table:
                name: chat_read_state
                schema: public
    - name: requests
      using:
        foreign_key_constraint_on:
            column: channel_id
            table:
                name: chat_request
                schema: public
object_relationships:
    - name: apitoken
      using:
        foreign_key_constraint_on: apitokens_id
    - name: archived_operator
      using:
        foreign_key_constraint_on: archived_by
    - name: chat_container
      using:
        foreign_key_constraint_on: chat_container_id
    - name: creator
      using:
        foreign_key_constraint_on: created_by
    - name: locked_operator
      using:
        foreign_key_constraint_on: locked_by
    - name: operation
      using:
        foreign_key_constraint_on: operation_id
select_permissions:
    - comment: 'authzgen: final _and term in filter/check is generated; edit the preceding row restrictions.'
      permission:
        allow_aggregations: true
        columns:
            - ai_metadata
            - apitokens_id
            - archived
            - archived_at
            - archived_by
            - channel_type
            - chat_container_id
            - chat_model
            - created_at
            - created_by
            - description
            - id
            - locked
            - locked_at
            - locked_by
            - last_message_id
            - name
            - operation_id
            - slug
            - updated_at
        filter:
            _and:
                - _and:
                    - operation_id:
                        _eq: X-Hasura-current-operation-id
                    - _or:
                        - channel_type:
                            _eq: standard
                        - channel_type:
                            _eq: ai
                - _or:
                    - _and:
                        - channel_type:
                            _eq: standard
                        - operation_id:
