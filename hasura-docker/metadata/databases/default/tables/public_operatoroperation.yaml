object_relationships:
    - name: apitoken
      using:
        foreign_key_constraint_on: apitokens_id
    - name: disabledcommandsprofile
      using:
        foreign_key_constraint_on: base_disabled_commands_id
    - name: operation
      using:
        foreign_key_constraint_on: operation_id
    - name: operator
      using:
        foreign_key_constraint_on: operator_id
select_permissions:
    - comment: 'authzgen: final _and term in filter/check is generated; edit the preceding row restrictions.'
      permission:
        columns:
            - apitokens_id
            - base_disabled_commands_id
            - id
            - operation_id
            - operator_id
            - view_mode
            - timestamp
        filter:
            _and:
                - operation_id:
                    _in: x-hasura-operation-read-operation-ids
      role: mythic_admin
    - comment: 'authzgen: final _and term in filter/check is generated; edit the preceding row restrictions.'
      permission:
        columns:
            - apitokens_id
            - base_disabled_commands_id
            - id
            - operation_id
            - operator_id
            - view_mode
            - timestamp
        filter:
            _and:
                - operation_id:
                    _eq: X-Hasura-current-operation-id
                - operation_id:
                    _in: x-hasura-operation-read-operation-ids
      role: operation_admin
    - comment: 'authzgen: final _and term in filter/check is generated; edit the preceding row restrictions.'
      permission:
        columns:
            - apitokens_id
            - base_disabled_commands_id
            - id
            - operation_id
            - operator_id
            - view_mode
            - timestamp
        filter:
            _and:
                - operation_id:
                    _eq: X-Hasura-current-operation-id
                - operation_id:
                    _in: x-hasura-operation-read-operation-ids
      role: operator
    - comment: 'authzgen: final _and term in filter/check is generated; edit the preceding row restrictions.'
      permission:
        columns:
            - apitokens_id
            - base_disabled_commands_id
            - id
            - operation_id
            - operator_id
            - view_mode
            - timestamp
        filter:
            _and:
                - operation_id:
                    _eq: X-Hasura-current-operation-id
                - operation_id:
                    _in: x-hasura-operation-read-operation-ids
      role: spectator
table:
    name: operatoroperation
    schema: public
