    - permission:
        columns:
            - id
            - name
            - os
            - t_num
            - tactic
        filter: {}
      role: operation_admin
    - permission:
        columns:
            - id
            - name
            - os
            - t_num
            - tactic
        filter: {}
      role: operator
    - permission:
        columns:
            - id
            - name
            - os
            - t_num
            - tactic
        filter: {}
      role: spectator
table:
    name: attack
    schema: public
