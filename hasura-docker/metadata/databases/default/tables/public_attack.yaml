array_relationships:
    - name: attackcommands
      using:
        foreign_key_constraint_on:
            column: attack_id
            table:
                name: attackcommand
                schema: public
    - name: attacktasks
      using:
        foreign_key_constraint_on:
            column: attack_id
            table:
                name: attacktask
                schema: public
select_permissions:
