object_relationships:
    - name: channel
      using:
        foreign_key_constraint_on: channel_id
    - name: last_read_message
      using:
        foreign_key_constraint_on: last_read_message_id
    - name: operation
      using:
        foreign_key_constraint_on: operation_id
    - name: operator
      using:
        foreign_key_constraint_on: operator_id
select_permissions:
    - comment: 'authzgen: final _and term in filter/check is generated; edit the preceding row restrictions.'
      permission:
        allow_aggregations: true
        columns:
            - channel_id
            - last_read_message_id
            - muted
            - operation_id
            - operator_id
            - updated_at
        filter:
            _and:
                - _and:
                    - operation_id:
                        _eq: X-Hasura-current-operation-id
                    - operator_id:
                        _eq: X-Hasura-User-Id
                    - channel:
                        _or:
                            - channel_type:
                                _eq: standard
                            - channel_type:
                                _eq: ai
                - _or:
                    - _and:
                        - channel:
                            channel_type:
                                _eq: standard
                        - operation_id:
                            _in: x-hasura-chat-read-operation-ids
                    - _and:
                        - channel:
                            channel_type:
                                _eq: ai
                        - operation_id:
                            _in: x-hasura-chat-ai-read-operation-ids
