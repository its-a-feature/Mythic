array_relationships:
    - name: filemeta
      using:
        foreign_key_constraint_on:
            column: mythictree_id
            table:
                name: filemeta
                schema: public
    - name: tags
      using:
        foreign_key_constraint_on:
            column: mythictree_id
            table:
                name: tag
                schema: public
computed_fields:
    - definition:
        function:
            name: mythictree_display_path
            schema: public
      name: display_path_text
    - definition:
        function:
            name: mythictree_full_path
            schema: public
      name: full_path_text
    - definition:
        function:
            name: mythictree_name
            schema: public
      name: name_text
    - definition:
        function:
            name: mythictree_parent_path
            schema: public
      name: parent_path_text
object_relationships:
    - name: apitoken
      using:
        foreign_key_constraint_on: apitokens_id
    - name: callback
      using:
        foreign_key_constraint_on: callback_id
    - name: operation
      using:
        foreign_key_constraint_on: operation_id
    - name: task
      using:
        foreign_key_constraint_on: task_id
select_permissions:
    - comment: 'authzgen: final _and term in filter/check is generated; edit the preceding row restrictions.'
      permission:
        allow_aggregations: true
        columns:
            - can_have_children
            - deleted
            - has_children
            - success
            - display_path
            - full_path
            - name
            - parent_path
            - apitokens_id
            - callback_id
            - id
            - operation_id
            - task_id
            - metadata
            - comment
            - host
            - os
            - tree_type
            - timestamp
        computed_fields:
            - display_path_text
            - full_path_text
            - name_text
            - parent_path_text
