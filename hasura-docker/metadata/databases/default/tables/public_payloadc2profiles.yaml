object_relationships:
    - name: c2profile
      using:
        foreign_key_constraint_on: c2_profile_id
    - name: payload
      using:
        foreign_key_constraint_on: payload_id
select_permissions:
    - comment: 'authzgen: final _and term in filter/check is generated; edit the preceding row restrictions.'
      permission:
        columns:
            - c2_profile_id
            - id
            - payload_id
        filter:
            _and:
                - payload:
                    operation_id:
                        _eq: X-Hasura-current-operation-id
                - payload:
                    operation_id:
                        _in: x-hasura-payload-read-operation-ids
      role: mythic_admin
