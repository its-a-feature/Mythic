object_relationships:
    - name: payload
      using:
        foreign_key_constraint_on: payload_id
    - name: payloadtype
      using:
        foreign_key_constraint_on: payloadtype_id
select_permissions:
    - comment: 'authzgen: final _and term in filter/check is generated; edit the preceding row restrictions.'
      permission:
        columns:
            - end_time
            - id
            - payload_id
            - payloadtype_id
            - start_time
            - step_description
            - step_name
            - step_number
            - step_skip
            - step_stderr
            - step_stdout
            - step_success
        filter:
            _and:
                - payload:
                    operation_id:
                        _eq: X-Hasura-current-operation-id
                - payload:
                    operation_id:
