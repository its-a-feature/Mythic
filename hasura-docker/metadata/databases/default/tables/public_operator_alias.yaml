object_relationships:
    - name: consuming_container
      using:
        foreign_key_constraint_on: consuming_container_id
    - name: operator
      using:
        foreign_key_constraint_on: operator_id
    - name: payloadtype
      using:
        foreign_key_constraint_on: payloadtype_id
select_permissions:
    - comment: 'authzgen: final _and term in filter/check is generated; edit the preceding row restrictions.'
      permission:
        allow_aggregations: true
        columns:
            - active
            - alias
            - alias_type
            - consuming_container_id
            - created_at
            - id
            - name
            - operator_id
            - payloadtype_id
            - updated_at
