array_relationships:
    - name: c2profile_file_hosts
      using:
        foreign_key_constraint_on:
            column: filemeta_id
            table:
                name: c2profile_file_host
                schema: public
    - name: copies_of_file
      using:
        foreign_key_constraint_on:
            column: copy_of_file_id
            table:
                name: filemeta
                schema: public
    - name: eventgroups
      using:
        foreign_key_constraint_on:
            column: filemeta_id
            table:
                name: eventgroup
                schema: public
    - name: payloads
      using:
        foreign_key_constraint_on:
            column: file_id
            table:
                name: payload
                schema: public
    - name: tags
      using:
        foreign_key_constraint_on:
            column: filemeta_id
            table:
                name: tag
                schema: public
computed_fields:
    - comment: convert bytea filename to text
      definition:
        function:
            name: filemeta_filename
            schema: public
      name: filename_text
    - definition:
        function:
            name: filemeta_filename_utf8
            schema: public
      name: filename_utf8
    - comment: convert bytea full_remote_path to text
      definition:
        function:
            name: filemeta_full_remote_path
            schema: public
      name: full_remote_path_text
    - definition:
        function:
            name: filemeta_full_remote_path_utf8
            schema: public
      name: full_remote_path_utf8
object_relationships:
    - name: apitoken
      using:
        foreign_key_constraint_on: apitokens_id
    - name: copy_of_file
      using:
        foreign_key_constraint_on: copy_of_file_id
    - name: eventgroup
      using:
        foreign_key_constraint_on: eventgroup_id
    - name: eventstepinstance
