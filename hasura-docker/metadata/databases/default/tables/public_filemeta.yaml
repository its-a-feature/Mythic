            - copy_of_file_id
            - eventgroup_id
            - eventstepinstance_id
            - id
            - mythictree_id
            - operation_id
            - operator_id
            - task_id
            - total_chunks
            - received_chunk_ids
            - agent_file_id
            - comment
            - host
            - md5
