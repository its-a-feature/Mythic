array_relationships:
    - name: callbacktokens
      using:
        foreign_key_constraint_on:
            column: token_id
            table:
                name: callbacktoken
                schema: public
    - name: tasks
      using:
        foreign_key_constraint_on:
            column: token_id
            table:
                name: task
                schema: public
object_relationships:
    - name: operation
      using:
        manual_configuration:
            column_mapping:
                operation_id: id
            insertion_order: null
            remote_table:
                name: operation
                schema: public
    - name: task
      using:
        foreign_key_constraint_on: task_id
select_permissions:
    - comment: 'authzgen: final _and term in filter/check is generated; edit the preceding row restrictions.'
      permission:
        allow_aggregations: true
        columns:
            - id
            - token_id
            - user
            - groups
            - default_dacl
            - session_id
            - restricted
            - capabilities
            - logon_sid
            - integrity_level_sid
            - app_container_sid
            - privileges
            - handle
            - task_id
            - timestamp
            - deleted
            - host
            - thread_id
            - process_id
            - description
            - operation_id
            - app_container_number
        filter:
            _and:
