object_relationships:
    - name: eventgroup
      using:
        foreign_key_constraint_on: eventgroup_id
    - name: operation
      using:
        foreign_key_constraint_on: operation_id
    - name: operator
      using:
        foreign_key_constraint_on: operator_id
select_permissions:
    - comment: 'authzgen: final _and term in filter/check is generated; edit the preceding row restrictions.'
      permission:
        columns:
            - approved
            - eventgroup_id
            - id
            - operation_id
            - operator_id
            - created_at
            - updated_at
        filter:
            _and:
                - operation_id:
                    _eq: X-Hasura-current-operation-id
                - operation_id:
                    _in: x-hasura-eventing-read-operation-ids
      role: mythic_admin
