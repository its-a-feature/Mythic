array_relationships:
    - name: chat_requests
      using:
        foreign_key_constraint_on:
            column: retry_of_id
            table:
                name: chat_request
                schema: public
    - name: response_messages
      using:
        foreign_key_constraint_on:
            column: chat_request_id
            table:
                name: chat_message
                schema: public
object_relationships:
    - name: channel
      using:
        foreign_key_constraint_on: channel_id
    - name: chat_container
      using:
        foreign_key_constraint_on: chat_container_id
    - name: creator
      using:
        foreign_key_constraint_on: created_by
    - name: operation
      using:
        foreign_key_constraint_on: operation_id
    - name: request_message
      using:
        foreign_key_constraint_on: request_message_id
    - name: retry_of
      using:
        foreign_key_constraint_on: retry_of_id
select_permissions:
    - comment: 'authzgen: final _and term in filter/check is generated; edit the preceding row restrictions.'
      permission:
        allow_aggregations: true
        columns:
            - cancelled_at
            - channel_id
            - chat_container_id
            - completed_at
            - context_snapshot
            - created_at
            - created_by
            - error
            - id
            - model
            - operation_id
            - request_message_id
            - retry_of_id
            - status
            - updated_at
        filter:
            _and:
                - operation_id:
                    _eq: X-Hasura-current-operation-id
