object_relationships:
    - name: callback
      using:
        foreign_key_constraint_on: callback_id
    - name: task
      using:
        foreign_key_constraint_on: task_id
    - name: token
      using:
        foreign_key_constraint_on: token_id
select_permissions:
    - comment: 'authzgen: final _and term in filter/check is generated; edit the preceding row restrictions.'
      permission:
        columns:
            - deleted
            - callback_id
            - id
            - task_id
            - token_id
            - host
            - os
            - timestamp_created
        filter:
            _and:
                - callback:
