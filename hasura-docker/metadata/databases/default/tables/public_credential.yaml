array_relationships:
    - name: tags
      using:
        foreign_key_constraint_on:
            column: credential_id
            table:
                name: tag
                schema: public
computed_fields:
    - definition:
        function:
            name: credential_credentials
            schema: public
      name: credential_text
configuration:
    column_config:
        credential:
            custom_name: credential_raw
    custom_column_names:
        credential: credential_raw
    custom_root_fields: {}
object_relationships:
    - name: apitoken
      using:
        foreign_key_constraint_on: apitokens_id
    - name: operation
      using:
        foreign_key_constraint_on: operation_id
    - name: operator
      using:
        foreign_key_constraint_on: operator_id
    - name: task
      using:
        foreign_key_constraint_on: task_id
select_permissions:
    - comment: 'authzgen: final _and term in filter/check is generated; edit the preceding row restrictions.'
      permission:
        allow_aggregations: true
        columns:
            - account
            - apitokens_id
            - comment
            - credential
            - credential_identity
            - custom_display
            - deleted
            - id
            - metadata
            - operation_id
            - operator_id
            - realm
            - subtype
            - task_id
            - timestamp
            - type
        computed_fields:
            - credential_text
        filter:
            _and:
                - operation_id:
                    _eq: X-Hasura-current-operation-id
                - operation_id:
