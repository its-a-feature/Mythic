object_relationships:
    - name: consuming_container
      using:
        foreign_key_constraint_on: consuming_container_id
    - name: eventgroup
      using:
        foreign_key_constraint_on: eventgroup_id
select_permissions:
    - comment: 'authzgen: final _and term in filter/check is generated; edit the preceding row restrictions.'
      permission:
        columns:
            - all_functions_available
            - consuming_container_id
            - eventgroup_id
            - id
            - function_names
            - consuming_container_name
        filter:
            _and:
                - eventgroup:
                    operation_id:
                        _eq: x-hasura-current-operation-id
