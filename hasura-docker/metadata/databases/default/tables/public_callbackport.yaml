object_relationships:
    - name: callback
      using:
        foreign_key_constraint_on: callback_id
    - name: operation
      using:
        foreign_key_constraint_on: operation_id
    - name: task
      using:
        foreign_key_constraint_on: task_id
select_permissions:
    - comment: 'authzgen: final _and term in filter/check is generated; edit the preceding row restrictions.'
      permission:
        allow_aggregations: true
        columns:
            - bytes_received
            - bytes_sent
            - deleted
            - callback_id
            - id
            - local_port
            - operation_id
            - remote_port
            - task_id
            - password
            - port_type
            - remote_ip
            - username
            - updated_at
